name: Lottery Table Mod Tests

on:
  push:
    branches:
      - main
      - fix/lottery-table-sidebar-stability
    paths:
      - 'lottery table mod/**'
      - '.github/workflows/lottery-table-mod-tests.yml'
  pull_request:
    paths:
      - 'lottery table mod/**'
      - '.github/workflows/lottery-table-mod-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check "lottery table mod/Rs-loteria-res-tabla-mod.user.js"
      - name: Layout stability regression
        working-directory: lottery table mod
        run: node test-layout-stability.js
