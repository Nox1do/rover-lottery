name: LotteryNet QA

on:
  push:
    branches: [main]
    paths:
      - 'LotteryNet/**'
      - '.github/workflows/lotterynet-qa.yml'
  pull_request:
    paths:
      - 'LotteryNet/**'
      - '.github/workflows/lotterynet-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 tests and inert bundle audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: LotteryNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependency
        run: npm install --no-audit --no-fund
      - name: Run full test suite
        run: npm test
      - name: Compile userscript
        run: npm run build
      - name: Syntax check built artifact
        run: node --check dist/LotteryNet-Rover.user.js
      - name: Ensure bundler entry remains inert
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src=fs.readFileSync('src/index.js','utf8');
          const bundle=fs.readFileSync('dist/LotteryNet-Rover.user.js','utf8');
          const forbidden=/\b(?:fetchLotteryNetResult|getLotteryNetHtml|fillVisualInputs|mountInlineStatus|startScheduler|autoProcesar)\s*\(/;
          if (forbidden.test(src) || forbidden.test(bundle)) {
            throw Error('Production entry invokes nonvalidated functionality');
          }
          if (!bundle.includes('INACTIVO')) {
            throw Error('Bundle missing inactive-development label');
          }
          console.log('Inactive bundle audit passed');
          NODE

  browser:
    name: Isolated Chromium Firefox browser regression
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 18
    defaults:
      run:
        working-directory: LotteryNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test framework
        run: npm install --no-audit --no-fund --no-save playwright
      - name: Install isolated browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Validate mock Rover UI with two browsers
        run: node tests/browser/isolated-rover.mjs
      - name: Verify manual LotteryUSA overlap without processing
        run: node tests/browser/manual-usa-overlap.mjs

  tampermonkey:
    name: Tampermonkey official extension QA
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LotteryNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tools
        run: npm install --no-audit --no-fund --no-save playwright@1.56.1
      - name: Install full Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify official Tampermonkey package
        run: python3 tests/browser/tampermonkey/prepare-extension.py
      - name: Validate real manager and network namespace
        run: node tests/browser/tampermonkey/run-isolated.mjs
      - name: Save QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotterynet-tampermonkey-qa
          path: |
            LotteryNet/test-results/tampermonkey/*.json
            LotteryNet/test-results/tampermonkey/*.png
          if-no-files-found: ignore

  tampermonkey-firefox:
    name: Firefox official Tampermonkey QA
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LotteryNet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firefox test framework
        run: npm install --no-audit --no-fund --no-save selenium-webdriver@4.51.0
      - name: Install official Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '158.0.1'
      - name: Install Mozilla geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          geckodriver-version: '0.37.1'
          token: ${{ github.token }}
      - name: Verify original AMO Tampermonkey package
        run: python3 tests/browser/tampermonkey/prepare-firefox-extension.py
      - name: Validate Firefox manager and network namespace
        env:
          LOTTERYNET_QA_MANAGER_BROWSER: firefox
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
          FIREFOX_EXPECTED_VERSION: '158.0.1'
        run: GECKODRIVER_PATH="$(command -v geckodriver)" node tests/browser/tampermonkey/run-isolated.mjs
      - name: Save Firefox QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotterynet-firefox-tampermonkey-qa
          path: |
            LotteryNet/test-results/tampermonkey-firefox/*.json
            LotteryNet/test-results/tampermonkey-firefox/*.png
          if-no-files-found: ignore
